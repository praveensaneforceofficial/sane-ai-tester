<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sane-AI Master Brain</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container { 
            max-width: 1400px; 
            margin: auto; 
        }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: white; 
            padding: 20px 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .header h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stats {
            display: flex;
            gap: 20px;
        }
        
        .stat-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .stat-badge.online {
            background: #d4edda;
            color: #155724;
        }
        
        .stat-badge.offline {
            background: #f8d7da;
            color: #721c24;
        }
        
        .stat-badge.total {
            background: #e7e7ff;
            color: #4a4aff;
        }
        
        .worker-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); 
            gap: 25px; 
            margin-top: 20px; 
        }
        
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.08); 
            border-top: 4px solid #ccc; 
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }
        
        .card.online { border-top-color: #28a745; }
        .card.offline { border-top-color: #dc3545; }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }
        
        .worker-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        
        .worker-id {
            font-size: 11px;
            color: #999;
            font-family: monospace;
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .status-badge.online {
            background: #d4edda;
            color: #155724;
        }
        
        .status-badge.offline {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status-dot { 
            height: 8px; 
            width: 8px; 
            border-radius: 50%; 
            display: inline-block; 
            margin-right: 6px;
        }
        
        .online-dot { background: #28a745; box-shadow: 0 0 5px #28a745; }
        .offline-dot { background: #dc3545; }
        
        .worker-info {
            font-size: 12px;
            color: #666;
            margin: 10px 0;
            padding: 8px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }
        
        .task-box { 
            margin-top: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        
        input { 
            padding: 10px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            transition: opacity 0.2s;
        }
        
        button:hover:not(:disabled) {
            opacity: 0.9;
            transform: scale(0.98);
        }
        
        button:disabled { 
            background: #ccc; 
            cursor: not-allowed;
        }
        
        .screenshot-area { 
            margin-top: 15px; 
            border: 2px dashed #ddd; 
            border-radius: 10px;
            min-height: 120px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #fafafa;
            overflow: hidden;
            position: relative;
        }
        
        img { 
            max-width: 100%; 
            max-height: 200px;
            border-radius: 8px; 
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .task-status {
            font-size: 12px;
            margin-top: 8px;
            padding: 5px;
            border-radius: 5px;
            text-align: center;
        }
        
        .task-status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .task-status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .refresh-btn {
            background: #6c757d;
            padding: 8px 16px;
            margin-left: 10px;
        }
        
        .no-workers {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 15px;
            color: #999;
        }
        
        @media (max-width: 768px) {
            .worker-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🧠 Sane-AI Master Brain</h1>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="stats" id="stats">
                <span class="stat-badge total">Total: 0</span>
                <span class="stat-badge online">🟢 Online: 0</span>
                <span class="stat-badge offline">🔴 Offline: 0</span>
            </div>
            <div id="api-status" style="font-size: 14px;">🔄 Connecting...</div>
            <button onclick="refreshWorkers()" class="refresh-btn" style="background: #28a745;">🔄 Refresh</button>
        </div>
    </div>

    <div id="worker-list" class="worker-grid">
        <div class="no-workers">Loading workers...</div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    // Configuration
    const API_URL = 'http://localhost:3000';
    // const API_URL = 'http://94.249.213.61:3000'; // Use this for production
    
    let socket = null;
    const workerListDiv = document.getElementById('worker-list');
    
    // Connect to Socket.IO
    function connectSocket() {
        if (socket && socket.connected) {
            socket.disconnect();
        }
        
        socket = io(API_URL, {
            reconnection: true,
            reconnectionAttempts: 5,
            reconnectionDelay: 1000
        });
        
        socket.on('connect', () => {
            console.log('✅ Connected to Central API');
            document.getElementById('api-status').innerHTML = '🟢 Connected to Central API';
            document.getElementById('api-status').style.color = '#28a745';
            fetchWorkers();
        });
        
        socket.on('disconnect', () => {
            console.log('❌ Disconnected from API');
            document.getElementById('api-status').innerHTML = '🔴 Disconnected';
            document.getElementById('api-status').style.color = '#dc3545';
        });
        
        socket.on('connect_error', (error) => {
            console.error('Connection error:', error);
            document.getElementById('api-status').innerHTML = '⚠️ Connection Error';
            document.getElementById('api-status').style.color = '#ffc107';
        });
        
        // Real-time Listeners
        socket.on('update-brain', () => {
            console.log('🔄 Update received, refreshing workers');
            fetchWorkers();
        });
        
        socket.on('task-completed-alert', async (data) => {
            console.log("📥 Task Finished by:", data.workerId, "Status:", data.status);
            await loadTaskResult(data.workerId);
        });
        
        socket.on('task-sent', (data) => {
            console.log('📤 Task sent:', data);
        });
        
        socket.on('task-error', (data) => {
            console.error('❌ Task error:', data);
            alert(`Task Error: ${data.error}`);
            // Hide loading for any worker
            document.querySelectorAll('[id^="loading-"]').forEach(el => {
                el.style.display = 'none';
            });
        });
    }
    
    // 1. Fetch Workers from API
    async function fetchWorkers() {
        try {
            const res = await fetch(`${API_URL}/api/workers`);
            if (!res.ok) throw new Error('Failed to fetch workers');
            const workers = await res.json();
            renderWorkers(workers);
            updateStats(workers);
        } catch (error) {
            console.error('Error fetching workers:', error);
            workerListDiv.innerHTML = `<div class="no-workers">❌ Error loading workers: ${error.message}</div>`;
        }
    }
    
    // 2. Update Statistics
    function updateStats(workers) {
        const total = workers.length;
        const online = workers.filter(w => w.status === 'online').length;
        const offline = total - online;
        
        document.querySelector('.stat-badge.total').innerHTML = `📊 Total: ${total}`;
        document.querySelector('.stat-badge.online').innerHTML = `🟢 Online: ${online}`;
        document.querySelector('.stat-badge.offline').innerHTML = `🔴 Offline: ${offline}`;
    }
    
    // 3. Load Task Result for a worker
    async function loadTaskResult(workerId) {
        try {
            const res = await fetch(`${API_URL}/api/tasks/${workerId}`);
            if (!res.ok) throw new Error('Failed to fetch tasks');
            const tasks = await res.json();
            const lastTask = tasks[0]; // Get newest task
            
            const loadingElement = document.getElementById(`loading-${workerId}`);
            const imgElement = document.getElementById(`img-${workerId}`);
            const taskStatusElement = document.getElementById(`task-status-${workerId}`);
            
            if (loadingElement) loadingElement.style.display = 'none';
            
            if (lastTask) {
                if (lastTask.status === 'completed' && lastTask.result_data) {
                    if (lastTask.result_data.screenshot) {
                        if (imgElement) {
                            imgElement.src = `data:image/png;base64,${lastTask.result_data.screenshot}`;
                            imgElement.style.display = 'block';
                        }
                    }
                    if (taskStatusElement) {
                        taskStatusElement.innerHTML = '✅ Task Completed Successfully';
                        taskStatusElement.className = 'task-status success';
                    }
                } else if (lastTask.status === 'failed') {
                    if (taskStatusElement) {
                        taskStatusElement.innerHTML = `❌ Failed: ${lastTask.result_data?.error || 'Unknown error'}`;
                        taskStatusElement.className = 'task-status error';
                    }
                }
            }
        } catch (error) {
            console.error('Error loading task result:', error);
        }
    }
    
    // 4. Render UI
    function renderWorkers(workers) {
        if (!workers || workers.length === 0) {
            workerListDiv.innerHTML = '<div class="no-workers">🤖 No workers connected. Start a worker to begin!</div>';
            return;
        }
        
        workerListDiv.innerHTML = workers.map(w => `
            <div class="card ${w.status === 'online' ? 'online' : 'offline'}" data-worker-id="${w.worker_id}">
                <div class="card-header">
                    <div>
                        <div class="worker-name">${escapeHtml(w.nickname || w.worker_id)}</div>
                        <div class="worker-id">${w.worker_id}</div>
                    </div>
                    <div class="status-badge ${w.status === 'online' ? 'online' : 'offline'}">
                        <span class="status-dot ${w.status === 'online' ? 'online-dot' : 'offline-dot'}"></span>
                        ${w.status === 'online' ? 'ONLINE' : 'OFFLINE'}
                    </div>
                </div>
                
                <div class="worker-info">
                    🌐 IP: ${w.system_ip || 'Unknown'} | 💻 OS: ${w.os_platform || 'Unknown'}
                    ${w.last_seen ? `<br>🕐 Last Seen: ${new Date(w.last_seen).toLocaleString()}` : ''}
                </div>
                
                <div class="task-box">
                    <input type="text" id="url-${w.worker_id}" 
                           placeholder="Enter URL (e.g., https://google.com)" 
                           ${w.status !== 'online' ? 'disabled' : ''}>
                    <button onclick="sendTask('${w.worker_id}')" 
                            ${w.status !== 'online' ? 'disabled' : ''}
                            id="btn-${w.worker_id}">
                        🚀 Run Task
                    </button>
                </div>
                
                <div id="task-status-${w.worker_id}" class="task-status" style="display: none;"></div>
                
                <div class="screenshot-area" id="result-${w.worker_id}">
                    <div id="loading-${w.worker_id}" style="display:none; text-align:center;">
                        <div class="loading-spinner"></div>
                        <span>Executing task... Please wait.</span>
                    </div>
                    <img id="img-${w.worker_id}" src="" style="display:none; max-width:100%;">
                    <div id="no-result-${w.worker_id}" style="color:#999; font-size:12px;">No screenshot yet</div>
                </div>
            </div>
        `).join('');
        
        // Load existing results for each worker
        workers.forEach(w => {
            if (w.worker_id) loadTaskResult(w.worker_id);
        });
    }
    
    // 5. Send Task
    function sendTask(workerId) {
        const urlInput = document.getElementById(`url-${workerId}`);
        if (!urlInput || !urlInput.value) {
            alert("Please enter a URL");
            return;
        }
        
        const url = urlInput.value.trim();
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            alert("Please enter a valid URL starting with http:// or https://");
            return;
        }
        
        // Show loading
        const loadingElement = document.getElementById(`loading-${workerId}`);
        const imgElement = document.getElementById(`img-${workerId}`);
        const noResultElement = document.getElementById(`no-result-${workerId}`);
        const taskStatusElement = document.getElementById(`task-status-${workerId}`);
        
        if (loadingElement) loadingElement.style.display = 'block';
        if (imgElement) imgElement.style.display = 'none';
        if (noResultElement) noResultElement.style.display = 'none';
        if (taskStatusElement) {
            taskStatusElement.style.display = 'block';
            taskStatusElement.innerHTML = '⏳ Task in progress...';
            taskStatusElement.className = 'task-status';
        }
        
        // Disable button
        const btn = document.getElementById(`btn-${workerId}`);
        if (btn) btn.disabled = true;
        
        // Emit task
        socket.emit('send-task-to-worker', {
            workerId: workerId,
            url: url,
            prompt: `Open ${url} and capture screenshot`
        });
        
        // Re-enable button after 30 seconds (timeout protection)
        setTimeout(() => {
            if (btn) btn.disabled = false;
        }, 30000);
    }
    
    // 7. Manual Refresh
    function refreshWorkers() {
        fetchWorkers();
    }
    
    // 8. Helper function to escape HTML
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // 9. Auto-refresh every 10 seconds
    setInterval(() => {
        if (socket && socket.connected) {
            fetchWorkers();
        }
    }, 10000);
    
    // Initialize connection
    connectSocket();
    
    // Export functions to global scope
    window.sendTask = sendTask;
    window.refreshWorkers = refreshWorkers;
</script>
</body>
</html>
